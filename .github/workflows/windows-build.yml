name: Windows development build
on:
  push:
    branches: [feature/capri-enhanced]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: capri-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'Shaken89/capri-desktop'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build, portable tests, Windows regressions and native smoke suite
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Upload test logs (no release publication)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capri-test-logs-${{ github.sha }}
          path: |
            out/*.log
            out/smoke-*/smoke-test.txt
            out/smoke-*/failure.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload development ZIP for laptop testing
        if: success() && github.ref == 'refs/heads/feature/capri-enhanced' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: capri-windows-dev-${{ github.sha }}
          path: |
            out/artifacts/*.zip
            out/artifacts/*.sha256
          if-no-files-found: error
          retention-days: 7
